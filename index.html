<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1814">
<script>
  // Apply the saved theme before first paint so there's no dark→light flash.
  // Solar reads its last-known resolution (course_solar_dark); the main script
  // recomputes from the sun once loaded.
  (function () {
    try {
      var m = localStorage.getItem('course_theme') || 'dark';
      var attr = m;
      if (m === 'solar') attr = localStorage.getItem('course_solar_dark') === '1' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', attr);
      var light = attr === 'light' || (attr === 'system' && window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: light)').matches);
      if (light) {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#f5efe4');
      }
    } catch (e) {}
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Course">
<title>Course</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<div id="otp-gate" style="position:fixed;inset:0;z-index:99999;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center">
    <div style="font-size:1.6rem;font-weight:600;color:var(--accent)">Course</div>
    <p id="otp-msg" style="color:var(--text-muted);font-size:.95rem">Sign in with your email. We'll send you an 8-digit code.</p>
    <input id="otp-email" type="email" placeholder="you@example.com" autocomplete="email" style="width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-elevated);color:var(--text);font-size:1rem;outline:none" />
    <input id="otp-code" type="text" inputmode="numeric" maxlength="8" placeholder="8-digit code" autocomplete="one-time-code" style="display:none;width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-elevated);color:var(--text);font-size:1rem;outline:none;letter-spacing:4px;text-align:center" />
    <button id="otp-send" style="width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);color:#1c1814;font-weight:600;font-size:1rem;cursor:pointer">Email me a code</button>
    <button id="otp-verify" style="display:none;width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);color:#1c1814;font-weight:600;font-size:1rem;cursor:pointer">Sign in</button>
    <button id="otp-back" style="display:none;background:none;border:none;color:var(--text-muted);font-size:.9rem;cursor:pointer">Use a different email</button>
    <p id="otp-err" style="color:var(--risk);font-size:.85rem;display:none"></p>
    <p style="color:var(--text-muted);font-size:.78rem">Your data is private to your account.</p>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

<script src="dev-config.js" onerror="void 0"></script>
<script src="supabase-client.js"></script>
<script src="settings-sync.js"></script>
<script src="notion-writeback.js"></script>
<script src="notion-sync.js"></script>
<script src="claude-shim.js"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="capture-sheet.jsx"></script>
<script type="text/babel" src="projects-data.jsx"></script>
<script type="text/babel" src="overlays.jsx"></script>
<script type="text/babel" src="next-moves.jsx"></script>
<script type="text/babel" src="status-log.jsx"></script>
<script type="text/babel" src="triage.jsx"></script>
<script type="text/babel" src="project.jsx"></script>
<script type="text/babel" src="today.jsx"></script>
<script type="text/babel" src="settings.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.hasSession && !window.hasSession()) window.showOtpGate();
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
